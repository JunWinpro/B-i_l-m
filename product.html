<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Aura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            margin-top: 2rem;
        }
        .product-detail-img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 8px;
            background: #eee;
        }
        .product-detail-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .product-detail-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .product-detail-price {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .product-detail-desc {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            color: var(--text-main);
        }
        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Aura.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
        </ul>
        <div class="nav-actions">
            <a href="cart.html" id="cart-link">Cart (0)</a>
            <a href="login.html" class="btn btn-primary" id="auth-btn">Sign In</a>
        </div>
    </nav>

    <main class="container section">
        <div id="product-detail-container">
            <!-- Product details will be injected here -->
            <p>Loading product...</p>
        </div>
    </main>

    <footer>
        <div class="footer-bottom" style="margin-top: 0; padding-top: 2rem;">
            <p>&copy; 2026 Aura. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
