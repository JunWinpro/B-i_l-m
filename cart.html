<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Aura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }
        .cart-summary {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 2rem;
            text-align: right;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Aura.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
        </ul>
        <div class="nav-actions">
            <a href="cart.html" class="active" id="cart-link">Cart (0)</a>
            <a href="login.html" class="btn btn-primary" id="auth-btn">Sign In</a>
        </div>
    </nav>

    <main class="container section">
        <h1>Your Cart</h1>
        <div id="cart-container">
            <!-- Cart items will be injected here -->
        </div>
        <div class="cart-summary" id="cart-summary" style="display: none;">
            <h3>Total: $<span id="cart-total">0.00</span></h3>
            <button class="btn btn-primary" style="margin-top: 1rem;" onclick="alert('Checkout functionality coming soon!')">Proceed to Checkout</button>
        </div>
    </main>

    <footer>
        <div class="footer-bottom" style="margin-top: 0; padding-top: 2rem;">
            <p>&copy; 2026 Aura. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
