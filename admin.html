<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Aura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        .admin-form {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            height: fit-content;
        }
        .admin-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .admin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .admin-item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .admin-item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }
        @media (max-width: 768px) {
            .admin-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Aura Admin.</a>
        <ul class="nav-links">
            <li><a href="index.html">View Site</a></li>
        </ul>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-primary" id="auth-btn">Sign In</a>
        </div>
    </nav>

    <main class="container section">
        <h1>Product Management</h1>
        <div class="admin-container">
            <!-- Add Product Form -->
            <div class="admin-form">
                <h3>Add New Product</h3>
                <form id="add-product-form" style="margin-top: 1rem;">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="admin-title" required>
                    </div>
                    <div class="form-group">
                        <label>Price ($)</label>
                        <input type="number" id="admin-price" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="admin-image" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="admin-desc" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Add Product</button>
                </form>
            </div>

            <!-- Product List -->
            <div>
                <h3>Current Products</h3>
                <div class="admin-list" id="admin-product-list" style="margin-top: 1rem;">
                    <!-- Products injected here -->
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
